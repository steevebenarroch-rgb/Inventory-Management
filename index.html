<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmIntel — Inventory Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f8; }
    #sidebar { width: 220px; min-height: 100vh; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
    #sidebar .nav-link { border-radius: .5rem; padding: .45rem .75rem; font-size: .875rem; transition: background .12s; cursor: pointer; }
    #sidebar .nav-link:hover { background: rgba(255,255,255,.1); }
    #sidebar .nav-link.active { background: #0d6efd; }
    .main-content { min-height: 100vh; }
    .card { border-radius: .75rem; }
    .card-header { border-radius: .75rem .75rem 0 0 !important; background: #fff; }
    .table th { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #6c757d; }
    .table td { font-size: .85rem; }
    .table-hover tbody tr:hover { background: #eef2ff !important; }
    .detail-cell { max-width: 300px; white-space: normal; line-height: 1.3; }
    .row-urgent td { background: #fff5f5 !important; }
    .row-dispose td { background: #fffbf0 !important; }
    .row-reduce td { background: #fffef5 !important; }
    .row-order-soon td { background: #f0f7ff !important; }
    .btn { border-radius: .5rem; font-size: .875rem; }
    .form-control, .form-select { border-radius: .5rem; font-size: .875rem; }
    .form-label { font-size: .85rem; margin-bottom: .25rem; }
    .alert { border-radius: .6rem; font-size: .875rem; }
    .data-banner { background: #fff; border-radius: .6rem; padding: .5rem 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    pre { white-space: pre-wrap; word-break: break-word; }
    @media(max-width:768px) {
      #sidebar { width: 60px !important; }
      #sidebar .label, #sidebar .fs-5, #sidebar small, #sidebar hr { display: none !important; }
      #sidebar .nav-link { text-align: center; padding: .5rem; }
      #sidebar .nav-link i { margin: 0 !important; font-size: 1.2rem; }
    }
  </style>
</head>
<body>
<div class="d-flex">
  <nav id="sidebar" class="d-flex flex-column flex-shrink-0 p-3 bg-dark text-white">
    <div class="d-flex align-items-center mb-3">
      <i class="bi bi-graph-up-arrow fs-4 me-2 text-info"></i>
      <span class="fs-5 fw-bold label">PharmIntel</span>
    </div>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto gap-1" id="nav-links">
      <li><a class="nav-link text-white" data-page="dashboard"><i class="bi bi-speedometer2 me-2"></i><span class="label">Dashboard</span></a></li>
      <li><a class="nav-link text-white" data-page="analysis"><i class="bi bi-bar-chart-line me-2"></i><span class="label">Movement Analysis</span></a></li>
      <li><a class="nav-link text-white" data-page="overstock"><i class="bi bi-box-arrow-left me-2"></i><span class="label">Dead Stock &amp; Overstock</span></a></li>
      <li><a class="nav-link text-white" data-page="reorder"><i class="bi bi-cart-plus me-2"></i><span class="label">Reorder Suggestions</span></a></li>
      <li><a class="nav-link text-white" data-page="returns"><i class="bi bi-arrow-counterclockwise me-2"></i><span class="label">Expired / Returns</span></a></li>
      <hr class="my-1 border-secondary">
      <li><a class="nav-link text-white" data-page="import"><i class="bi bi-cloud-upload me-2"></i><span class="label">Import from EMS</span></a></li>
      <li><a class="nav-link text-white" data-page="settings"><i class="bi bi-sliders me-2"></i><span class="label">Settings</span></a></li>
    </ul>
    <hr>
    <small class="text-muted label">PharmIntel v1.0</small>
  </nav>
  <div id="main" class="flex-grow-1 p-4 main-content"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="pharmaintel.js"></script>
</body>
</html>

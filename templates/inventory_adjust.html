{% extends "base.html" %}
{% block title %}Adjust Stock — PharmaCare{% endblock %}
{% block content %}

<div class="mb-4">
  <a href="{{ url_for('inventory') }}" class="text-decoration-none text-muted small">
    <i class="bi bi-arrow-left me-1"></i>Back to Inventory
  </a>
  <h2 class="fw-bold mt-1"><i class="bi bi-pencil-square me-2 text-primary"></i>Add / Adjust Stock</h2>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Product <span class="text-danger">*</span></label>
            <select name="product_id" class="form-select" required>
              <option value="">— Select a product —</option>
              {% for p in products %}
              <option value="{{ p.id }}">{{ p.name }} {% if p.ndc %}({{ p.ndc }}){% endif %} — Stock: {{ p.total_stock }} {{ p.unit }}s</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Transaction Type <span class="text-danger">*</span></label>
            <select name="transaction_type" class="form-select" required id="txnType">
              <option value="received">Received (add stock)</option>
              <option value="dispensed">Dispensed (remove stock)</option>
              <option value="adjusted">Manual Adjustment (remove)</option>
              <option value="expired">Remove Expired</option>
              <option value="returned">Returned to Supplier</option>
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Quantity <span class="text-danger">*</span></label>
              <input type="number" name="quantity" class="form-control" min="1" required placeholder="0">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Lot Number</label>
              <input type="text" name="lot_number" class="form-control" placeholder="LOT-XXXX">
            </div>
          </div>

          <div class="row" id="receivedFields">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Expiry Date</label>
              <input type="date" name="expiry_date" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Storage Location</label>
              <input type="text" name="location" class="form-control" placeholder="e.g. A-1-1">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Reference #</label>
            <input type="text" name="reference" class="form-control" placeholder="PO number, prescription #, etc.">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Performed By</label>
            <input type="text" name="performed_by" class="form-control" placeholder="Staff name">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Notes</label>
            <textarea name="notes" class="form-control" rows="2" placeholder="Optional notes…"></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-circle me-1"></i>Save
            </button>
            <a href="{{ url_for('inventory') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Show/hide expiry and location for non-received transactions
  const txnType = document.getElementById('txnType');
  const receivedFields = document.getElementById('receivedFields');
  txnType.addEventListener('change', () => {
    receivedFields.style.display = txnType.value === 'received' ? '' : 'none';
  });
  // init
  if (txnType.value !== 'received') receivedFields.style.display = 'none';
</script>
{% endblock %}

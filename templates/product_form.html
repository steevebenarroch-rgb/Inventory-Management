{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'New' }} Product — PharmaCare{% endblock %}
{% block content %}

<div class="mb-4">
  <a href="{{ url_for('products') }}" class="text-decoration-none text-muted small">
    <i class="bi bi-arrow-left me-1"></i>Back to Products
  </a>
  <h2 class="fw-bold mt-1">
    <i class="bi bi-{{ 'pencil' if product else 'plus-circle' }} me-2 text-primary"></i>
    {{ 'Edit Product' if product else 'Add New Product' }}
  </h2>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post">
          <div class="row">
            <div class="col-md-8 mb-3">
              <label class="form-label fw-semibold">Brand / Trade Name <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" required
                     value="{{ product.name if product else '' }}" placeholder="e.g. Amoxicillin 500mg Capsules">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label fw-semibold">NDC</label>
              <input type="text" name="ndc" class="form-control"
                     value="{{ product.ndc if product else '' }}" placeholder="00000-0000-00">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Generic Name</label>
            <input type="text" name="generic_name" class="form-control"
                   value="{{ product.generic_name if product else '' }}" placeholder="e.g. Amoxicillin">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Category</label>
              <select name="category_id" class="form-select">
                <option value="">— Select —</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if product and product.category_id == cat.id %}selected{% endif %}>
                  {{ cat.name }}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Supplier</label>
              <select name="supplier_id" class="form-select">
                <option value="">— Select —</option>
                {% for sup in suppliers %}
                <option value="{{ sup.id }}" {% if product and product.supplier_id == sup.id %}selected{% endif %}>
                  {{ sup.name }}
                </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label fw-semibold">Unit</label>
              <select name="unit" class="form-select">
                {% for u in ['tablet','capsule','vial','bottle','inhaler','patch','syringe','unit','softgel','suppository'] %}
                <option value="{{ u }}" {% if product and product.unit == u %}selected{% endif %}>{{ u|title }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label fw-semibold">Reorder Point</label>
              <input type="number" name="reorder_point" class="form-control" min="0"
                     value="{{ product.reorder_point if product else 10 }}">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label fw-semibold">Unit Cost ($)</label>
              <input type="number" name="unit_cost" class="form-control" min="0" step="0.01"
                     value="{{ '%.2f'|format(product.unit_cost) if product else '0.00' }}">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Description / Notes</label>
            <textarea name="description" class="form-control" rows="3">{{ product.description if product else '' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-circle me-1"></i>{{ 'Save Changes' if product else 'Add Product' }}
            </button>
            <a href="{{ url_for('products') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ 'Edit' if supplier else 'New' }} Supplier — PharmaCare{% endblock %}
{% block content %}

<div class="mb-4">
  <a href="{{ url_for('suppliers') }}" class="text-decoration-none text-muted small">
    <i class="bi bi-arrow-left me-1"></i>Back to Suppliers
  </a>
  <h2 class="fw-bold mt-1">
    <i class="bi bi-{{ 'pencil' if supplier else 'plus-circle' }} me-2 text-primary"></i>
    {{ 'Edit Supplier' if supplier else 'Add Supplier' }}
  </h2>
</div>

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Supplier Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required
                   value="{{ supplier.name if supplier else '' }}" placeholder="e.g. PharmaCo Distributors">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Contact Person</label>
            <input type="text" name="contact" class="form-control"
                   value="{{ supplier.contact if supplier else '' }}" placeholder="Full name">
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Phone</label>
              <input type="text" name="phone" class="form-control"
                     value="{{ supplier.phone if supplier else '' }}" placeholder="555-0000">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control"
                     value="{{ supplier.email if supplier else '' }}" placeholder="orders@supplier.com">
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-circle me-1"></i>{{ 'Save Changes' if supplier else 'Add Supplier' }}
            </button>
            <a href="{{ url_for('suppliers') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
